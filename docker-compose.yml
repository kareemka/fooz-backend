services:
  api:
    build: .
    container_name: fooz-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:root@db:5432/fooz?schema=public
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads

  db:
    image: postgres:15-alpine
    container_name: fooz-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=fooz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fooz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
